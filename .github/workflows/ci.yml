name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commits:
    name: Commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Reject Claude co-author trailers
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            RANGE="$HEAD"
          else
            RANGE="$BASE..$HEAD"
          fi
          if git log --format='%H%n%B' "$RANGE" | grep -iE '^co-authored-by:.*(claude|anthropic)'; then
            echo "::error::Commits must not include a Claude/Anthropic Co-Authored-By trailer."
            exit 1
          fi
      - name: 'Enforce "type(vX.Y.Z): message" commit subjects'
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            RANGE="$HEAD"
          else
            RANGE="$BASE..$HEAD"
          fi
          PATTERN='^(feat|fix|docs|refactor|test|ci|chore|security|perf|style|build|revert)\(v[0-9]+\.[0-9]+\.[0-9]+\)!?: .+'
          BAD=$(git log --no-merges --format='%an%x09%s' "$RANGE" | grep -v '^dependabot\[bot\]' | cut -f2- | grep -vE "$PATTERN" || true)
          if [ -n "$BAD" ]; then
            echo "::error::Commit subjects must look like 'feat(v0.1.2): message'. Offending commits:"
            echo "$BAD"
            exit 1
          fi

  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Unused code (knip)
        run: npm run knip
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Exactly one <h1> per page
        run: npm run check:h1
      - name: Dependency audit
        run: npm audit --audit-level=low
