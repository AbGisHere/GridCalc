name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commits:
    name: Commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Commit range of this push or PR
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          # New branches and force-pushes have no usable base, so check the whole history.
          if git cat-file -e "$BASE^{commit}" 2>/dev/null && git merge-base --is-ancestor "$BASE" "$HEAD"; then
            echo "RANGE=$BASE..$HEAD" >> "$GITHUB_ENV"
          else
            echo "RANGE=$HEAD" >> "$GITHUB_ENV"
          fi
      - name: Reject Claude co-author trailers
        run: |
          if git log --format='%H%n%B' "$RANGE" | grep -iE '^co-authored-by:.*(claude|anthropic)'; then
            echo "::error::Commits must not include a Claude/Anthropic Co-Authored-By trailer."
            exit 1
          fi
      - name: 'Enforce "type(vX.Y.Z): message" commit subjects'
        run: |
          PATTERN='^(feat|fix|docs|refactor|test|ci|chore|security|perf|style|build|revert)\(v[0-9]+\.[0-9]+\.[0-9]+\)!?: .+'
          BAD=$(git log --no-merges --format='%an%x09%s' "$RANGE" | grep -v '^dependabot\[bot\]' | cut -f2- | grep -vE "$PATTERN" || true)
          if [ -n "$BAD" ]; then
            echo "::error::Commit subjects must look like 'feat(v0.1.2): message'. Offending commits:"
            echo "$BAD"
            exit 1
          fi

      - name: Version, lockfile and CHANGELOG match the release
        if: github.event_name == 'push'
        run: |
          SUBJECT=$(git log -1 --no-merges --format=%s)
          WANT=$(echo "$SUBJECT" | sed -nE 's/^[a-z]+\(v([0-9]+\.[0-9]+\.[0-9]+)\).*/\1/p')
          PKG=$(node -p "require('./package.json').version")
          LOCK=$(node -p "const l=require('./package-lock.json'); l.version === l.packages[''].version ? l.version : 'mismatch'")
          LOG=$(grep -m1 -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md | tr -d '#[] ')
          echo "commit=$WANT package.json=$PKG package-lock.json=$LOCK CHANGELOG=$LOG"
          if [ -n "$WANT" ] && { [ "$WANT" != "$PKG" ] || [ "$PKG" != "$LOCK" ] || [ "$PKG" != "$LOG" ]; }; then
            echo "::error::Every push is a release: bump package.json/package-lock.json and add a CHANGELOG heading for the commit's version."
            exit 1
          fi

  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Unused code (knip)
        run: npm run knip
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Exactly one <h1> per page
        run: npm run check:h1
      - name: Dependency audit
        run: npm audit --audit-level=low
